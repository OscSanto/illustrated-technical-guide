<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="640" version="1.1" viewBox="0 0 1280 640" width="1280" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F9FAFB" height="640" rx="18" stroke="#D0D6DC" stroke-width="2" width="1280" x="0" y="0" /><circle cx="42" cy="44" fill="#D82F79" r="21" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-style="normal" font-weight="bold" text-anchor="middle" x="42" y="51">8</text><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-style="normal" font-weight="bold" text-anchor="start" x="82" y="49">One supervised logit update: probabilities to gradients</text><text fill="#71808D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-style="italic" font-weight="normal" text-anchor="start" x="82" y="80">Our worked example • multiclass cross-entropy • illustrative direct-logit update, not full model backpropagation</text><rect fill="#FFFFFF" height="415" rx="12" stroke="#68737B" stroke-width="2" width="291" x="24" y="134" /><rect fill="#E5F2FA" height="45" rx="8" stroke="none" stroke-width="0" width="264" x="38" y="150" /><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="bold" text-anchor="start" x="50" y="180">1  Forward</text><text fill="#71808D" font-family="DejaVu Sans Mono, monospace" font-size="16" font-style="normal" font-weight="normal" text-anchor="start" x="42" y="238">Logits z = [2, 1, 0]</text><rect fill="#FFFFFF" height="415" rx="12" stroke="#68737B" stroke-width="2" width="291" x="345" y="134" /><rect fill="#FBE7EF" height="45" rx="8" stroke="none" stroke-width="0" width="264" x="359" y="150" /><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="bold" text-anchor="start" x="371" y="180">2  Compare</text><text fill="#71808D" font-family="DejaVu Sans Mono, monospace" font-size="16" font-style="normal" font-weight="normal" text-anchor="start" x="363" y="238">Gold class = A</text><rect fill="#FFFFFF" height="415" rx="12" stroke="#68737B" stroke-width="2" width="291" x="666" y="134" /><rect fill="#FFF0DF" height="45" rx="8" stroke="none" stroke-width="0" width="264" x="680" y="150" /><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="bold" text-anchor="start" x="692" y="180">3  Gradient</text><text fill="#71808D" font-family="DejaVu Sans Mono, monospace" font-size="16" font-style="normal" font-weight="normal" text-anchor="start" x="684" y="238">p - one_hot(A)</text><rect fill="#FFFFFF" height="415" rx="12" stroke="#68737B" stroke-width="2" width="291" x="987" y="134" /><rect fill="#EAF7EC" height="45" rx="8" stroke="none" stroke-width="0" width="264" x="1001" y="150" /><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="bold" text-anchor="start" x="1013" y="180">4  Update</text><text fill="#71808D" font-family="DejaVu Sans Mono, monospace" font-size="16" font-style="normal" font-weight="normal" text-anchor="start" x="1005" y="238">eta = 0.1</text><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-style="normal" font-weight="bold" text-anchor="start" x="46" y="296">A</text><rect fill="#E9ECEF" height="28" rx="5" stroke="none" stroke-width="0" width="175" x="89" y="274" /><rect fill="#2D92D5" height="28" rx="5" stroke="none" stroke-width="0" width="116.375" x="89" y="274" /><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-style="normal" font-weight="bold" text-anchor="start" x="268" y="296">0.665</text><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-style="normal" font-weight="bold" text-anchor="start" x="46" y="374">B</text><rect fill="#E9ECEF" height="28" rx="5" stroke="none" stroke-width="0" width="175" x="89" y="352" /><rect fill="#2D92D5" height="28" rx="5" stroke="none" stroke-width="0" width="42.875" x="89" y="352" /><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-style="normal" font-weight="bold" text-anchor="start" x="268" y="374">0.245</text><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-style="normal" font-weight="bold" text-anchor="start" x="46" y="452">C</text><rect fill="#E9ECEF" height="28" rx="5" stroke="none" stroke-width="0" width="175" x="89" y="430" /><rect fill="#2D92D5" height="28" rx="5" stroke="none" stroke-width="0" width="15.75" x="89" y="430" /><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-style="normal" font-weight="bold" text-anchor="start" x="268" y="452">0.090</text><text fill="#39434D" font-family="DejaVu Sans Mono, monospace" font-size="19" font-style="normal" font-weight="normal" text-anchor="start" x="365" y="301">y = [1, 0, 0]</text><text fill="#39434D" font-family="DejaVu Sans Mono, monospace" font-size="18" font-style="normal" font-weight="normal" text-anchor="start" x="365" y="369">Loss = -ln(0.665)</text><text fill="#D82F79" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-style="normal" font-weight="bold" text-anchor="start" x="365" y="425">≈ 0.408</text><text fill="#71808D" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-style="normal" font-weight="normal" text-anchor="start" x="365" y="488">Higher p(A) = lower loss</text><text fill="#39434D" font-family="DejaVu Sans Mono, monospace" font-size="15" font-style="normal" font-weight="normal" text-anchor="start" x="686" y="303">[-0.335, 0.245, 0.090]</text><text fill="#2E9E52" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-style="normal" font-weight="bold" text-anchor="start" x="686" y="374">A: raise logit</text><text fill="#E98618" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-style="normal" font-weight="bold" text-anchor="start" x="686" y="418">B,C: lower logits</text><text fill="#71808D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-style="normal" font-weight="normal" text-anchor="start" x="686" y="482">Sum of grads ≈ 0</text><text fill="#39434D" font-family="DejaVu Sans Mono, monospace" font-size="16" font-style="normal" font-weight="normal" text-anchor="start" x="1008" y="302">z_new = z - eta*g</text><text fill="#2E9E52" font-family="DejaVu Sans Mono, monospace" font-size="18" font-style="normal" font-weight="bold" text-anchor="start" x="1007" y="373">A   2.0335</text><text fill="#39434D" font-family="DejaVu Sans Mono, monospace" font-size="18" font-style="normal" font-weight="normal" text-anchor="start" x="1007" y="420">B   0.9755</text><text fill="#39434D" font-family="DejaVu Sans Mono, monospace" font-size="18" font-style="normal" font-weight="normal" text-anchor="start" x="1007" y="467">C  -0.0090</text><line fill="none" stroke="#39434D" stroke-width="2" x1="315" x2="344" y1="331" y2="331" /><polygon fill="#39434D" points="344,331 333.2093040419421,338.2498883260884 333.2093040419421,323.7501116739116" /><line fill="none" stroke="#39434D" stroke-width="2" x1="636" x2="665" y1="331" y2="331" /><polygon fill="#39434D" points="665,331 654.2093040419421,338.2498883260884 654.2093040419421,323.7501116739116" /><line fill="none" stroke="#39434D" stroke-width="2" x1="957" x2="986" y1="331" y2="331" /><polygon fill="#39434D" points="986,331 975.2093040419421,338.2498883260884 975.2093040419421,323.7501116739116" /><text fill="#71808D" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-style="normal" font-weight="normal" text-anchor="start" x="28" y="618">The real model updates parameters through backpropagation. These logits are independent toy variables.</text></svg>