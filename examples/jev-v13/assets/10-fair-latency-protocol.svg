<svg baseProfile="full" height="620" version="1.1" viewBox="0 0 1280 620" width="1280" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F9FAFB" height="620" rx="18" stroke="#D0D6DC" stroke-width="2" width="1280" x="0" y="0" /><circle cx="42" cy="44" fill="#D82F79" r="21" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-style="normal" font-weight="bold" text-anchor="middle" x="42" y="51">10</text><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-style="normal" font-weight="bold" text-anchor="start" x="82" y="49">How to compare generation and direct readout fairly</text><text fill="#71808D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-style="italic" font-weight="normal" text-anchor="start" x="82" y="80">Our benchmark design • paired inputs and hardware, no measured timings or Jev speedup claims</text><rect fill="#F5EFE5" height="84" rx="12" stroke="#68737B" stroke-width="2" width="1234" x="23" y="125" /><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-style="normal" font-weight="bold" text-anchor="start" x="52" y="160">Hold fixed</text><text fill="#39434D" font-family="DejaVu Sans Mono, monospace" font-size="17" font-style="normal" font-weight="normal" text-anchor="start" x="54" y="190">same model  •  same input  •  same questions  •  same hardware  •  same warm-up</text><rect fill="#FFFFFF" height="270" rx="12" stroke="#68737B" stroke-width="2" width="603" x="25" y="246" /><rect fill="#FFF0DF" height="52" rx="9" stroke="none" stroke-width="0" width="577" x="38" y="262" /><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="bold" text-anchor="start" x="55" y="296">A  Generate structured text</text><rect fill="#F5EFE5" height="82" rx="12" stroke="#68737B" stroke-width="2" width="232" x="55" y="354" /><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-style="normal" font-weight="bold" text-anchor="middle" x="171" y="403">prefill + decode</text><line fill="none" stroke="#39434D" stroke-width="3" x1="291" x2="323" y1="395" y2="395" /><polygon fill="#39434D" points="323,395 312.2093040419421,402.2498883260884 312.2093040419421,387.7501116739116" /><rect fill="#E9ECEF" height="82" rx="12" stroke="#68737B" stroke-width="2" width="265" x="327" y="354" /><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-style="normal" font-weight="bold" text-anchor="middle" x="459" y="403">parse JSON</text><text fill="#71808D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-style="normal" font-weight="normal" text-anchor="start" x="55" y="484">Collect: p50, p95, token count, error rate</text><rect fill="#FFFFFF" height="270" rx="12" stroke="#68737B" stroke-width="2" width="603" x="652" y="246" /><rect fill="#EAF7EC" height="52" rx="9" stroke="none" stroke-width="0" width="577" x="665" y="262" /><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="bold" text-anchor="start" x="682" y="296">B  Read option logits</text><rect fill="#F5EFE5" height="82" rx="12" stroke="#68737B" stroke-width="2" width="232" x="682" y="354" /><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-style="normal" font-weight="bold" text-anchor="middle" x="798" y="403">prefill + score</text><line fill="none" stroke="#39434D" stroke-width="3" x1="918" x2="950" y1="395" y2="395" /><polygon fill="#39434D" points="950,395 939.2093040419421,402.2498883260884 939.2093040419421,387.7501116739116" /><rect fill="#E9ECEF" height="82" rx="12" stroke="#68737B" stroke-width="2" width="265" x="954" y="354" /><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-style="normal" font-weight="bold" text-anchor="middle" x="1086" y="403">normalize scores</text><text fill="#71808D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-style="normal" font-weight="normal" text-anchor="start" x="682" y="484">Collect: p50, p95, token count, error rate</text><rect fill="#E5F2FA" height="45" rx="8" stroke="none" stroke-width="0" width="782" x="247" y="543" /><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-style="normal" font-weight="bold" text-anchor="middle" x="638" y="573">Report measured distributions with units and test conditions; do not invent speedups.</text><text fill="#71808D" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-style="normal" font-weight="normal" text-anchor="start" x="28" y="598">SemIf source-reported 5.33 s vs 1.02 s belongs to figure 1, not to this proposed benchmark.</text></svg>