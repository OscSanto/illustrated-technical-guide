<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="600" version="1.1" viewBox="0 0 1280 600" width="1280" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F9FAFB" height="600" rx="18" stroke="#D0D6DC" stroke-width="2" width="1280" x="0" y="0" /><circle cx="42" cy="44" fill="#D82F79" r="21" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-style="normal" font-weight="bold" text-anchor="middle" x="42" y="51">11</text><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-style="normal" font-weight="bold" text-anchor="start" x="82" y="49">Why the action threshold depends on error costs</text><text fill="#71808D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-style="italic" font-weight="normal" text-anchor="start" x="82" y="80">Our numerical decision-theory example • not Jev policy, calibration, or an operational recommendation</text><rect fill="#FFFFFF" height="393" rx="12" stroke="#68737B" stroke-width="2" width="600" x="23" y="130" /><rect fill="#FFFFFF" height="393" rx="12" stroke="#68737B" stroke-width="2" width="603" x="651" y="130" /><rect fill="#E5F2FA" height="53" rx="9" stroke="none" stroke-width="0" width="570" x="39" y="146" /><rect fill="#FFF0DF" height="53" rx="9" stroke="none" stroke-width="0" width="572" x="667" y="146" /><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="bold" text-anchor="start" x="60" y="180">Two possible actions</text><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="bold" text-anchor="start" x="688" y="180">Choose the lower expected loss</text><text fill="#2E9E52" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="bold" text-anchor="start" x="54" y="243">Act</text><text fill="#39434D" font-family="DejaVu Sans Mono, monospace" font-size="17" font-style="normal" font-weight="normal" text-anchor="start" x="54" y="277">False positive cost = 20</text><text fill="#E98618" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="bold" text-anchor="start" x="54" y="342">Do not act</text><text fill="#39434D" font-family="DejaVu Sans Mono, monospace" font-size="17" font-style="normal" font-weight="normal" text-anchor="start" x="54" y="376">False negative cost = 1</text><text fill="#71808D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-style="normal" font-weight="normal" text-anchor="start" x="54" y="452">Let p = Pr(event is true).</text><text fill="#39434D" font-family="DejaVu Sans Mono, monospace" font-size="17" font-style="normal" font-weight="normal" text-anchor="start" x="675" y="244">Cost(act) = 20 × (1 - p)</text><text fill="#39434D" font-family="DejaVu Sans Mono, monospace" font-size="17" font-style="normal" font-weight="normal" text-anchor="start" x="675" y="291">Cost(wait) = 1 × p</text><line fill="none" stroke="#BAC3CC" stroke-width="2" x1="681" x2="1222" y1="316" y2="316" /><text fill="#39434D" font-family="DejaVu Sans Mono, monospace" font-size="18" font-style="normal" font-weight="normal" text-anchor="start" x="675" y="362">Act when 20(1-p) &lt; p</text><text fill="#E98618" font-family="DejaVu Sans Mono, monospace" font-size="22" font-style="normal" font-weight="bold" text-anchor="start" x="675" y="419">p &gt; 20/21 ≈ 0.9524</text><text fill="#71808D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-style="normal" font-weight="normal" text-anchor="start" x="675" y="482">Only if these costs and p are valid.</text><text fill="#71808D" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-style="normal" font-weight="normal" text-anchor="start" x="28" y="578">Decision costs are hypothetical; model confidence must be calibrated and policy constraints still apply.</text></svg>