<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="720" version="1.1" viewBox="0 0 1280 720" width="1280" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F9FAFB" height="720" rx="18" stroke="#D0D6DC" stroke-width="2" width="1280" x="0" y="0" /><circle cx="42" cy="42" fill="#D82F79" r="21" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-style="normal" font-weight="bold" text-anchor="middle" x="42" y="49">1</text><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-style="normal" font-weight="bold" text-anchor="start" x="79" y="48">From fixed labels to typed decisions</text><text fill="#71808D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-style="italic" font-weight="normal" text-anchor="start" x="79" y="80">Four approaches • source-adapted concepts, original artwork • probabilities are illustrative</text><rect fill="#FFFFFF" height="276" rx="18" stroke="#68737B" stroke-width="2" width="610" x="20" y="110" /><rect fill="#E5F2FA" height="44" rx="9" stroke="none" stroke-width="0" width="574" x="38" y="128" /><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-style="normal" font-weight="bold" text-anchor="start" x="55" y="158">1  Fixed labels</text><text fill="#71808D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-style="normal" font-weight="normal" text-anchor="start" x="50" y="202">A classifier learns 3 output rows</text><rect fill="#F5EFE5" height="52" rx="8" stroke="#68737B" stroke-width="2" width="550" x="50" y="222" /><text fill="#39434D" font-family="DejaVu Sans Mono, monospace" font-size="17" font-style="normal" font-weight="normal" text-anchor="start" x="67" y="255">Ticket → encoder → linear head</text><line fill="none" stroke="#39434D" stroke-width="3" x1="325" x2="325" y1="276" y2="297" /><polygon fill="#39434D" points="325,297 318.89150301099556,286.6710956759527 331.10849698900444,286.6710956759527" /><text fill="#39434D" font-family="DejaVu Sans Mono, monospace" font-size="19" font-style="normal" font-weight="bold" text-anchor="start" x="55" y="328">billing .90  |  tech .06  |  account .04</text><text fill="#71808D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-style="normal" font-weight="normal" text-anchor="start" x="50" y="368">A new label requires retraining</text><rect fill="#FFFFFF" height="276" rx="18" stroke="#68737B" stroke-width="2" width="610" x="650" y="110" /><rect fill="#F5EFE5" height="44" rx="9" stroke="none" stroke-width="0" width="574" x="668" y="128" /><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-style="normal" font-weight="bold" text-anchor="start" x="685" y="158">2  NLI hypotheses</text><text fill="#71808D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-style="normal" font-weight="normal" text-anchor="start" x="680" y="202">Each candidate is written as a claim</text><rect fill="#F5EFE5" height="52" rx="8" stroke="#68737B" stroke-width="2" width="550" x="680" y="222" /><text fill="#39434D" font-family="DejaVu Sans Mono, monospace" font-size="17" font-style="normal" font-weight="normal" text-anchor="start" x="697" y="255">Ticket + “about billing” → NLI</text><line fill="none" stroke="#39434D" stroke-width="3" x1="955" x2="955" y1="276" y2="297" /><polygon fill="#39434D" points="955,297 948.8915030109955,286.6710956759527 961.1084969890045,286.6710956759527" /><text fill="#39434D" font-family="DejaVu Sans Mono, monospace" font-size="19" font-style="normal" font-weight="bold" text-anchor="start" x="685" y="328">billing .91  |  tech .12  |  account .30</text><text fill="#71808D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-style="normal" font-weight="normal" text-anchor="start" x="680" y="368">One model pass for each label</text><rect fill="#FFFFFF" height="276" rx="18" stroke="#68737B" stroke-width="2" width="610" x="20" y="400" /><rect fill="#FFF0DF" height="44" rx="9" stroke="none" stroke-width="0" width="574" x="38" y="418" /><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-style="normal" font-weight="bold" text-anchor="start" x="55" y="448">3  Letter logits</text><text fill="#71808D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-style="normal" font-weight="normal" text-anchor="start" x="50" y="492">All options appear in the prompt</text><rect fill="#F5EFE5" height="52" rx="8" stroke="#68737B" stroke-width="2" width="550" x="50" y="512" /><text fill="#39434D" font-family="DejaVu Sans Mono, monospace" font-size="17" font-style="normal" font-weight="normal" text-anchor="start" x="67" y="545">Ticket + A/B/C → next-token scores</text><line fill="none" stroke="#39434D" stroke-width="3" x1="325" x2="325" y1="566" y2="587" /><polygon fill="#39434D" points="325,587 318.89150301099556,576.6710956759526 331.10849698900444,576.6710956759526" /><text fill="#39434D" font-family="DejaVu Sans Mono, monospace" font-size="19" font-style="normal" font-weight="bold" text-anchor="start" x="55" y="618">A .88  |  B .07  |  C .05</text><text fill="#71808D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-style="normal" font-weight="normal" text-anchor="start" x="50" y="658">One question per answer position</text><rect fill="#FFFFFF" height="276" rx="18" stroke="#68737B" stroke-width="2" width="610" x="650" y="400" /><rect fill="#EAF7EC" height="44" rx="9" stroke="none" stroke-width="0" width="574" x="668" y="418" /><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-style="normal" font-weight="bold" text-anchor="start" x="685" y="448">4  Decision interface</text><text fill="#71808D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-style="normal" font-weight="normal" text-anchor="start" x="680" y="492">Shared state + typed questions</text><rect fill="#F5EFE5" height="52" rx="8" stroke="#68737B" stroke-width="2" width="550" x="680" y="512" /><text fill="#39434D" font-family="DejaVu Sans Mono, monospace" font-size="17" font-style="normal" font-weight="normal" text-anchor="start" x="697" y="545">State → Q1 / Q2 / Q3</text><line fill="none" stroke="#39434D" stroke-width="3" x1="955" x2="955" y1="566" y2="587" /><polygon fill="#39434D" points="955,587 948.8915030109955,576.6710956759526 961.1084969890045,576.6710956759526" /><text fill="#39434D" font-family="DejaVu Sans Mono, monospace" font-size="19" font-style="normal" font-weight="bold" text-anchor="start" x="685" y="618">team .90  |  refund .95  |  mood .60</text><text fill="#71808D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-style="normal" font-weight="normal" text-anchor="start" x="680" y="658">Question isolation: design-specific</text><text fill="#71808D" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-style="normal" font-weight="normal" text-anchor="start" x="28" y="696">Do not infer proprietary Jev architecture from these conceptual progressions.</text></svg>