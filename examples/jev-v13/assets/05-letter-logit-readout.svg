<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="556" version="1.1" viewBox="0 0 1280 556" width="1280" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F9FAFB" height="556" rx="18" stroke="#D0D6DC" stroke-width="2" width="1280" x="0" y="0" /><circle cx="42" cy="42" fill="#D82F79" r="21" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-style="normal" font-weight="bold" text-anchor="middle" x="42" y="49">5</text><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-style="normal" font-weight="bold" text-anchor="start" x="79" y="48">A decision without decoding the answer</text><text fill="#71808D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-style="italic" font-weight="normal" text-anchor="start" x="79" y="80">Source-adapted SemIf/JevK5-style readout • sample logits and probabilities are ours</text><rect fill="#FFFFFF" height="197" rx="14" stroke="#68737B" stroke-width="2" width="292" x="24" y="138" /><rect fill="#E5F2FA" height="55" rx="8" stroke="none" stroke-width="0" width="260" x="40" y="154" /><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-style="normal" font-weight="bold" text-anchor="start" x="51" y="189">1   Format options</text><text fill="#39434D" font-family="DejaVu Sans Mono, monospace" font-size="15" font-style="normal" font-weight="normal" text-anchor="start" x="48" y="255">Billing (A) · Technical (B) · Account (C)</text><line fill="none" stroke="#39434D" stroke-width="3" x1="314" x2="338" y1="240" y2="240" /><polygon fill="#39434D" points="338,240 327.6710956759527,246.10849698900446 327.6710956759527,233.89150301099554" /><rect fill="#FFFFFF" height="197" rx="14" stroke="#68737B" stroke-width="2" width="292" x="337" y="138" /><rect fill="#F5EFE5" height="55" rx="8" stroke="none" stroke-width="0" width="260" x="353" y="154" /><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-style="normal" font-weight="bold" text-anchor="start" x="364" y="189">2   Prefill once</text><text fill="#39434D" font-family="DejaVu Sans Mono, monospace" font-size="15" font-style="normal" font-weight="normal" text-anchor="start" x="361" y="255">Prompt ends at: Answer: (</text><line fill="none" stroke="#39434D" stroke-width="3" x1="627" x2="651" y1="240" y2="240" /><polygon fill="#39434D" points="651,240 640.6710956759526,246.10849698900446 640.6710956759526,233.89150301099554" /><rect fill="#FFFFFF" height="197" rx="14" stroke="#68737B" stroke-width="2" width="292" x="650" y="138" /><rect fill="#FBE7EF" height="55" rx="8" stroke="none" stroke-width="0" width="260" x="666" y="154" /><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-style="normal" font-weight="bold" text-anchor="start" x="677" y="189">3   Extract letter logits</text><text fill="#39434D" font-family="DejaVu Sans Mono, monospace" font-size="15" font-style="normal" font-weight="normal" text-anchor="start" x="674" y="255">A: 2.0       B: 1.0       C: 0.0</text><line fill="none" stroke="#39434D" stroke-width="3" x1="940" x2="964" y1="240" y2="240" /><polygon fill="#39434D" points="964,240 953.6710956759526,246.10849698900446 953.6710956759526,233.89150301099554" /><rect fill="#FFFFFF" height="197" rx="14" stroke="#68737B" stroke-width="2" width="292" x="963" y="138" /><rect fill="#EAF7EC" height="55" rx="8" stroke="none" stroke-width="0" width="260" x="979" y="154" /><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-style="normal" font-weight="bold" text-anchor="start" x="990" y="189">4   Normalize allowed letters</text><text fill="#39434D" font-family="DejaVu Sans Mono, monospace" font-size="15" font-style="normal" font-weight="normal" text-anchor="start" x="987" y="255">softmax([2, 1, 0])</text><rect fill="#FFFFFF" height="124" rx="14" stroke="#68737B" stroke-width="2" width="630" x="323" y="360" /><text fill="#39434D" font-family="DejaVu Sans Mono, monospace" font-size="19" font-style="normal" font-weight="normal" text-anchor="start" x="340" y="392">P(A) = e² / (e² + e¹ + e⁰) = 0.665</text><text fill="#2D92D5" font-family="DejaVu Sans Mono, monospace" font-size="19" font-style="normal" font-weight="bold" text-anchor="start" x="340" y="426">P(B) = 0.245</text><text fill="#E98618" font-family="DejaVu Sans Mono, monospace" font-size="19" font-style="normal" font-weight="bold" text-anchor="start" x="611" y="426">P(C) = 0.090</text><text fill="#71808D" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-style="normal" font-weight="normal" text-anchor="start" x="28" y="532">Illustrative computation; output-token scores are not automatically calibrated decision confidence.</text></svg>