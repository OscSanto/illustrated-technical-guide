n)</text><text fill="#71808D" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-style="normal" font-weight="normal" text-anchor="start" x="28" y="573">The combination and weighting of losses depend on the actual project; not a disclosed Jev recipe.</text></svg>