<svg baseProfile="full" height="570" version="1.1" viewBox="0 0 1280 570" width="1280" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F9FAFB" height="570" rx="18" stroke="#D0D6DC" stroke-width="2" width="1280" x="0" y="0" /><circle cx="42" cy="44" fill="#D82F79" r="21" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-style="normal" font-weight="bold" text-anchor="middle" x="42" y="51">12</text><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-style="normal" font-weight="bold" text-anchor="start" x="82" y="49">Model judgment is not permission to act</text><text fill="#71808D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-style="italic" font-weight="normal" text-anchor="start" x="82" y="80">Our recommended application-control design • not a documented TypeSafe Jev internal architecture</text><rect fill="#FFFFFF" height="210" rx="12" stroke="#68737B" stroke-width="2" width="222" x="24" y="172" /><rect fill="#F5EFE5" height="55" rx="9" stroke="none" stroke-width="0" width="196" x="37" y="188" /><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-style="normal" font-weight="bold" text-anchor="start" x="45" y="219">1  Untrusted request</text><text fill="#39434D" font-family="DejaVu Sans Mono, monospace" font-size="14" font-style="normal" font-weight="normal" text-anchor="start" x="45" y="286">Ticket: “refund me”</text><text fill="#71808D" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-style="normal" font-weight="normal" text-anchor="start" x="45" y="340">input</text><line fill="none" stroke="#39434D" stroke-width="2" x1="246" x2="276" y1="282" y2="282" /><polygon fill="#39434D" points="276,282 265.2093040419421,289.2498883260884 265.2093040419421,274.7501116739116" /><rect fill="#FFFFFF" height="210" rx="12" stroke="#68737B" stroke-width="2" width="222" x="277" y="172" /><rect fill="#E5F2FA" height="55" rx="9" stroke="none" stroke-width="0" width="196" x="290" y="188" /><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-style="normal" font-weight="bold" text-anchor="start" x="298" y="219">2  Typed judgment</text><text fill="#39434D" font-family="DejaVu Sans Mono, monospace" font-size="14" font-style="normal" font-weight="normal" text-anchor="start" x="298" y="286">Refund intent: 0.95</text><text fill="#71808D" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-style="normal" font-weight="normal" text-anchor="start" x="298" y="340">model output</text><line fill="none" stroke="#39434D" stroke-width="2" x1="499" x2="529" y1="282" y2="282" /><polygon fill="#39434D" points="529,282 518.2093040419421,289.2498883260884 518.2093040419421,274.7501116739116" /><rect fill="#FFFFFF" height="210" rx="12" stroke="#68737B" stroke-width="2" width="222" x="530" y="172" /><rect fill="#FBE7EF" height="55" rx="9" stroke="none" stroke-width="0" width="196" x="543" y="188" /><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-style="normal" font-weight="bold" text-anchor="start" x="551" y="219">3  Validation</text><text fill="#39434D" font-family="DejaVu Sans Mono, monospace" font-size="14" font-style="normal" font-weight="normal" text-anchor="start" x="551" y="286">Check evidence &amp; auth</text><text fill="#71808D" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-style="normal" font-weight="normal" text-anchor="start" x="551" y="340">trusted code</text><line fill="none" stroke="#39434D" stroke-width="2" x1="752" x2="782" y1="282" y2="282" /><polygon fill="#39434D" points="782,282 771.2093040419421,289.2498883260884 771.2093040419421,274.7501116739116" /><rect fill="#FFFFFF" height="210" rx="12" stroke="#68737B" stroke-width="2" width="222" x="783" y="172" /><rect fill="#FFF0DF" height="55" rx="9" stroke="none" stroke-width="0" width="196" x="796" y="188" /><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-style="normal" font-weight="bold" text-anchor="start" x="804" y="219">4  Policy gate</text><text fill="#39434D" font-family="DejaVu Sans Mono, monospace" font-size="14" font-style="normal" font-weight="normal" text-anchor="start" x="804" y="286">Allowed? Limits?</text><text fill="#71808D" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-style="normal" font-weight="normal" text-anchor="start" x="804" y="340">trusted code</text><line fill="none" stroke="#39434D" stroke-width="2" x1="1005" x2="1035" y1="282" y2="282" /><polygon fill="#39434D" points="1035,282 1024.209304041942,289.2498883260884 1024.209304041942,274.7501116739116" /><rect fill="#FFFFFF" height="210" rx="12" stroke="#68737B" stroke-width="2" width="222" x="1036" y="172" /><rect fill="#EAF7EC" height="55" rx="9" stroke="none" stroke-width="0" width="196" x="1049" y="188" /><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-style="normal" font-weight="bold" text-anchor="start" x="1057" y="219">5  Outcome</text><text fill="#39434D" font-family="DejaVu Sans Mono, monospace" font-size="14" font-style="normal" font-weight="normal" text-anchor="start" x="1057" y="286">Act or human review</text><text fill="#71808D" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-style="normal" font-weight="normal" text-anchor="start" x="1057" y="340">logged action</text><rect fill="#E9ECEF" height="61" rx="10" stroke="none" stroke-width="0" width="756" x="261" y="414" /><text fill="#39434D" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-style="normal" font-weight="bold" text-anchor="middle" x="638" y="451">The model may estimate. Application logic authorizes and records actions.</text><text fill="#71808D" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-style="normal" font-weight="normal" text-anchor="start" x="28" y="548">A model’s score never bypasses permissions, domain rules, auditing, or required human oversight.</text></svg>