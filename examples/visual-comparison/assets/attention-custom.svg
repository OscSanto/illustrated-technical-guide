<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 530" width="1120" height="530" role="img"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#535a62"/></marker></defs><rect width="1120" height="530" fill="#f8f9fb"/><text x="32" y="46" font-size="24" font-weight="800" text-anchor="start" fill="#3a424a" font-family="Inter, Source Sans 3, Arial, sans-serif">Scaled dot-product attention: one query, two keys</text><text x="32" y="78" font-size="15" font-weight="450" text-anchor="start" fill="#76808c" font-family="Inter, Source Sans 3, Arial, sans-serif">Toy calculation with dₖ = 2. Numbers are calculated, not measured.</text><rect x="34" y="126" width="164" height="90" rx="11" fill="white" stroke="#535a62" stroke-width="2"/><text x="50" y="159" font-size="17" font-weight="700" text-anchor="start" fill="#2d92d5" font-family="Inter, Source Sans 3, Arial, sans-serif">Query q</text><text x="50" y="190" font-size="19" font-weight="600" text-anchor="start" fill="#3a424a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">[1, 0]</text><rect x="260" y="126" width="164" height="90" rx="11" fill="white" stroke="#535a62" stroke-width="2"/><text x="276" y="159" font-size="17" font-weight="700" text-anchor="start" fill="#2e9e52" font-family="Inter, Source Sans 3, Arial, sans-serif">Key k₁</text><text x="276" y="190" font-size="19" font-weight="600" text-anchor="start" fill="#3a424a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">[1, 0]</text><rect x="454" y="126" width="164" height="90" rx="11" fill="white" stroke="#535a62" stroke-width="2"/><text x="470" y="159" font-size="17" font-weight="700" text-anchor="start" fill="#ee8517" font-family="Inter, Source Sans 3, Arial, sans-serif">Key k₂</text><text x="470" y="190" font-size="19" font-weight="600" text-anchor="start" fill="#3a424a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">[0, 1]</text><text x="35" y="261" font-size="18" font-weight="750" text-anchor="start" fill="#3a424a" font-family="Inter, Source Sans 3, Arial, sans-serif">Step 1 · dot products, scaled by √dₖ</text><rect x="35" y="279" width="590" height="64" rx="11" fill="#f7efe3" stroke="#535a62" stroke-width="1.5"/><text x="52" y="307" font-size="17" font-weight="600" text-anchor="start" fill="#3a424a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">scores = [q·k₁, q·k₂] / sqrt(2)</text><text x="52" y="330" font-size="15" font-weight="550" text-anchor="start" fill="#3a424a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">= [0.7071, 0.0000]</text><text x="35" y="384" font-size="18" font-weight="750" text-anchor="start" fill="#3a424a" font-family="Inter, Source Sans 3, Arial, sans-serif">Step 2 · softmax gives attention weights</text><rect x="35" y="400" width="590" height="65" rx="11" fill="#eaf5e9" stroke="#535a62" stroke-width="1.5"/><text x="52" y="429" font-size="18" font-weight="650" text-anchor="start" fill="#3a424a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">weights = [0.6698, 0.3302]</text><text x="52" y="453" font-size="12" font-weight="450" text-anchor="start" fill="#76808c" font-family="Inter, Source Sans 3, Arial, sans-serif">They sum to 1; each tells how much to read from a value.</text><text x="694" y="125" font-size="18" font-weight="750" text-anchor="start" fill="#3a424a" font-family="Inter, Source Sans 3, Arial, sans-serif">Step 3 · weight the values</text><rect x="685" y="146" width="396" height="268" rx="11" fill="white" stroke="#535a62" stroke-width="2"/><text x="708" y="184" font-size="18" font-weight="700" text-anchor="start" fill="#2e9e52" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">v₁ = [10, 0]</text><text x="708" y="218" font-size="18" font-weight="700" text-anchor="start" fill="#ee8517" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">v₂ = [0, 20]</text><text x="708" y="267" font-size="15" font-weight="600" text-anchor="start" fill="#3a424a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">output = w₁ · v₁ + w₂ · v₂</text><text x="708" y="305" font-size="22" font-weight="800" text-anchor="start" fill="#2d92d5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">= [6.70, 6.60]</text><text x="708" y="365" font-size="13" font-weight="500" text-anchor="start" fill="#3a424a" font-family="Inter, Source Sans 3, Arial, sans-serif">Each dimension is a weighted SUM,</text><text x="708" y="384" font-size="13" font-weight="500" text-anchor="start" fill="#3a424a" font-family="Inter, Source Sans 3, Arial, sans-serif">not a choice of just one value.</text><text x="33" y="502" font-size="13" font-weight="450" text-anchor="start" fill="#76808c" font-family="Inter, Source Sans 3, Arial, sans-serif">Original teaching example · Simplified to a single-head, single-query calculation; not a full transformer architecture.</text></svg>