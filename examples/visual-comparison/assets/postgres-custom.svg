<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 510" width="1120" height="510" role="img"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#535a62"/></marker></defs><rect width="1120" height="510" fill="#f8f9fb"/><text x="34" y="46" font-size="25" font-weight="800" text-anchor="start" fill="#3a424a" font-family="Inter, Source Sans 3, Arial, sans-serif">LEFT JOIN: follow each customer to its matching order rows</text><text x="34" y="79" font-size="15" font-weight="450" text-anchor="start" fill="#76808c" font-family="Inter, Source Sans 3, Arial, sans-serif">ON customers.id = orders.customer_id  •  an unmatched customer remains as a NULL-filled row</text><text x="35" y="133" font-size="17" font-weight="700" text-anchor="start" fill="#3a424a" font-family="Inter, Source Sans 3, Arial, sans-serif">customers (left table)</text><rect x="35" y="147" width="212" height="172" rx="9" fill="white" stroke="#535a62" stroke-width="1.8"/><rect x="36" y="148" width="210" height="42" rx="8" fill="#e7edf2"/><text x="47" y="174" font-size="13" font-weight="700" text-anchor="start" fill="#3a424a" font-family="Inter, Source Sans 3, Arial, sans-serif">id</text><text x="114" y="174" font-size="13" font-weight="700" text-anchor="start" fill="#3a424a" font-family="Inter, Source Sans 3, Arial, sans-serif">customer</text><path d="M35 190 H247" stroke="#d0d7dd"/><text x="47" y="217" font-size="13" font-weight="600" text-anchor="start" fill="#2d92d5" font-family="Inter, Source Sans 3, Arial, sans-serif">1</text><text x="114" y="217" font-size="13" font-weight="450" text-anchor="start" fill="#3a424a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">Ada</text><rect x="36" y="233" width="210" height="43" fill="#f4f7fa"/><path d="M35 233 H247" stroke="#d0d7dd"/><text x="47" y="260" font-size="13" font-weight="600" text-anchor="start" fill="#2d92d5" font-family="Inter, Source Sans 3, Arial, sans-serif">