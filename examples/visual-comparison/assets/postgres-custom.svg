 font-weight="600" text-anchor="start" fill="#2e9e52" font-family="Inter, Source Sans 3, Arial, sans-serif">Ada</text><text x="856" y="199" font-size="13" font-weight="450" text-anchor="start" fill="#3a424a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">101</text><text x="982" y="199" font-size="13" font-weight="450" text-anchor="start" fill="#3a424a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">$30</text><rect x="719" y="215" width="362" height="43" fill="#f4f7fa"/><path d="M718 215 H1082" stroke="#d0d7dd"/><text x="730" y="242" font-size="13" font-weight="600" text-anchor="start" fill="#2e9e52" font-family="Inter, Source Sans 3, Arial, sans-serif">Ada</text><text x="856" y="242" font-size="13" font-weight="450" text-anchor="start" fill="#3a424a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">102</text><text x="982" y="242" font-size="13" font-weight="450" text-anchor="start" fill="#3a424a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">$22</text><path d="M718 258 H1082" stroke="#d0d7dd"/><text x="730" y="285" font-size="13" font-weight="600" text-anchor="start" fill="#2e9e52" font-family="Inter, Source Sans 3, Arial, sans-serif">Ben</text><text x="856" y="285" font-size="13" font-weight="450" text-anchor="start" fill="#3a424a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">103</text><text x="982" y="285" font-size="13" font-weight="450" text-anchor="start" fill="#3a424a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">$12</text><rect x="719" y="301" width="362" height="43" fill="#f4f7fa"/><path d="M718 301 H1082" stroke="#d0d7dd"/><text x="730" y="328" font-size="13" font-weight="600" text-anchor="start" fill="#2e9e52" font-family="Inter, Source Sans 3, Arial, sans-serif">Cleo</text><text x="856" y="328" font-size="13" font-weight="450" text-anchor="start" fill="#3a424a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">NULL</text><text x="982" y="328" font-size="13" font-weight="450" text-anchor="start" fill="#3a424a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">NULL</text><path d="M844 129 V344" stroke="#e0e5e9"/><path d="M970 129 V344" stroke="#e0e5e9"/><path d="M248 264 H282" stroke="#535a62" stroke-width="2.3" fill="none" marker-end="url(#arr)"/><path d="M576 265 H694" stroke="#535a62" stroke-width="2.3" fill="none" marker-end="url(#arr)"/><text x="630" y="245" font-size="12" font-weight="600" text-anchor="middle" fill="#76808c" font-family="Inter, Source Sans 3, Arial, sans-serif">match on id</text><rect x="34" y="364" width="620" height="108" rx="12" fill="#f0f6fb" stroke="#bbd7ea" stroke-width="1.5"/><text x="54" y="396" font-size="17" font-weight="750" text-anchor="start" fill="#2d92d5" font-family="Inter, Source Sans 3, Arial, sans-serif">Why 4 result rows?</text><text x="54" y="424" font-size="15" font-weight="500" text-anchor="start" fill="#3a424a" font-family="Inter, Source Sans 3, Arial, sans-serif">Ada has 2 orders → 2 rows; Ben has 1 → 1 row.</text><text x="54" y="448" font-size="15" font-weight="500" text-anchor="start" fill="#3a424a" font-family="Inter, Source Sans 3, Arial, sans-serif">Cleo has no orders → 1 preserved row with NULLs.</text><rect x="715" y="390" width="375" height="82" rx="12" fill="#eef7ef" stroke="#b6d7bf" stroke-width="1.5"/><text x="734" y="418" font-size="16" font-weight="700" text-anchor="start" fill="#2e9e52" font-family="Inter, Source Sans 3, Arial, sans-serif">Mechanism, not an ER diagram</text><text x="734" y="445" font-size="13" font-weight="500" text-anchor="start" fill="#3a424a" font-family="Inter, Source Sans 3, Arial, sans-serif">Shows row multiplication and NULL preservation.</text></svg>