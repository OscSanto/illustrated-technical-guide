<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 355" role="img" aria-labelledby="heading" style="font-synthesis:none"><title id="heading">04-embedding</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#34424e"/></marker></defs><rect x="1" y="1" width="978" height="353" rx="16" fill="#f7f9fb" stroke="#cbd3da"/><text x="500" y="38" font-family="Arial,sans-serif" font-weight="bold" font-size="23" fill="#34424e" text-anchor="middle">One document → one 384-D semantic vector</text><rect x="23" y="89" width="210" height="90" rx="11" fill="#fff" stroke="#2e8fd1" stroke-width="2"/><text x="128.0" y="114" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">passage: title + lead</text><text x="128.0" y="136" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">input text</text><rect x="267" y="89" width="210" height="90" rx="11" fill="#fff" stroke="#e78321" stroke-width="2"/><text x="372.0" y="114" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">SentencePiece</text><text x="372.0" y="136" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">≤256 tokens</text><rect x="510" y="89" width="210" height="90" rx="11" fill="#fff" stroke="#2f9f5b" stroke-width="2"/><text x="615.0" y="114" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">ONNX E5 int8</text><text x="615.0" y="136" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">token representations</text><rect x="753" y="89" width="210" height="90" rx="11" fill="#fff" stroke="#d4317b" stroke-width="2"/><text x="858.0" y="114" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">masked mean + L2</text><text x="858.0" y="136" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">unit-length vector</text><path d="M233,135 L267,135" fill="none" stroke="#34424e" stroke-width="2" marker-end="url(#arrow)"/><path d="M477,135 L510,135" fill="none" stroke="#34424e" stroke-width="2" marker-end="url(#arrow)"/><path d="M720,135 L753,135" fill="none" stroke="#34424e" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="241" font-family="Arial,sans-serif" font-weight="bold" font-size="17" fill="#34424e" text-anchor="middle">Indexing: passage: ...     Query: query: ...</text><text x="500" y="282" font-family="Arial,sans-serif" font-weight="normal" font-size="16" fill="#34424e" text-anchor="middle">Mean pool non-padding hidden states; divide by vector norm.</text><text x="500" y="319" font-family="Arial,sans-serif" font-weight="normal" font-size="15" fill="#e78321" text-anchor="middle">No multi-chunk expansion: short/title-only entries do not get vectors.</text></svg>