<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 385" role="img" aria-labelledby="heading" style="font-synthesis:none"><title id="heading">09-resource-budget</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#34424e"/></marker></defs><rect x="1" y="1" width="978" height="383" rx="16" fill="#f7f9fb" stroke="#cbd3da"/><text x="500" y="35" font-family="Arial,sans-serif" font-weight="bold" font-size="22" fill="#34424e" text-anchor="middle">Resource model: capacity is not the same as parallel speed</text><rect x="22" y="105" width="218" height="112" rx="11" fill="#fff" stroke="#e78321" stroke-width="2"/><text x="131.0" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">512 MB</text><text x="131.0" y="152" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">Pi Zero 2 W</text><rect x="267" y="105" width="218" height="112" rx="11" fill="#fff" stroke="#2e8fd1" stroke-width="2"/><text x="376.0" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">4 GB</text><text x="376.0" y="152" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">Pi 5</text><rect x="512" y="105" width="218" height="112" rx="11" fill="#fff" stroke="#2f9f5b" stroke-width="2"/><text x="621.0" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">8 GB</text><text x="621.0" y="152" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">Pi 5</text><rect x="757" y="105" width="218" height="112" rx="11" fill="#fff" stroke="#d4317b" stroke-width="2"/><text x="866.0" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">16 GB</text><text x="866.0" y="152" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">Desktop</text><text x="500" y="272" font-family="Arial,sans-serif" font-weight="normal" font-size="15" fill="#34424e" text-anchor="middle">Peak RSS = model + tokenizer + SQLite + FAISS pages + batch buffers + runtime overhead</text><text x="500" y="317" font-family="Arial,sans-serif" font-weight="normal" font-size="15" fill="#e78321" text-anchor="middle">Real measurements required: peak RSS, CPU%, build time, p50/p95 latency, throughput.</text><text x="500" y="356" font-family="Arial,sans-serif" font-weight="normal" font-size="14" fill="#d4317b" text-anchor="middle">Hardware tiers are test profiles, not measured performance claims.</text></svg>