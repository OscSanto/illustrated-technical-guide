<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 414" role="img" aria-labelledby="heading" style="font-synthesis:none"><title id="heading">07-query-fusion</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#34424e"/></marker></defs><rect x="1" y="1" width="978" height="412" rx="16" fill="#f7f9fb" stroke="#cbd3da"/><text x="500" y="34" font-family="Arial,sans-serif" font-weight="bold" font-size="22" fill="#34424e" text-anchor="middle">One search combines three non-comparable rankings</text><rect x="29" y="92" width="287" height="95" rx="11" fill="#fff" stroke="#2e8fd1" stroke-width="2"/><text x="172.5" y="117" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">Meaning</text><text x="172.5" y="139" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">FAISS / cosine</text><rect x="346" y="92" width="287" height="95" rx="11" fill="#fff" stroke="#e78321" stroke-width="2"/><text x="489.5" y="117" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">Title words</text><text x="489.5" y="139" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">SQLite FTS5 / BM25</text><rect x="664" y="92" width="287" height="95" rx="11" fill="#fff" stroke="#2f9f5b" stroke-width="2"/><text x="807.5" y="117" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">Full text</text><text x="807.5" y="139" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">ZIM / Xapian</text><path d="M173,187 L173,236" fill="none" stroke="#34424e" stroke-width="2" marker-end="url(#arrow)"/><path d="M490,187 L490,236" fill="none" stroke="#34424e" stroke-width="2" marker-end="url(#arrow)"/><path d="M808,187 L808,236" fill="none" stroke="#34424e" stroke-width="2" marker-end="url(#arrow)"/><path d="M173,23