<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img" aria-labelledby="heading" style="font-synthesis:none"><title id="heading">02-zim-decomposition</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#34424e"/></marker></defs><rect x="1" y="1" width="978" height="388" rx="16" fill="#f7f9fb" stroke="#cbd3da"/><text x="500" y="40" font-family="Arial,sans-serif" font-weight="bold" font-size="23" fill="#34424e" text-anchor="middle">read_entry(): classify an entry before embedding</text><rect x="390" y="72" width="220" height="65" rx="11" fill="#fff" stroke="#2e8fd1" stroke-width="2"/><text x="500.0" y="97" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">ZIM entry</text><text x="500.0" y="119" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">by numeric entry ID</text><rect x="34" y="205" width="270" height="83" rx="11" fill="#fff" stroke="#e78321" stroke-width="2"/><text x="169.0" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">Redirect</text><text x="169.0" y="252" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">target row ID + path</text><rect x="358" y="205" width="275" height="83" rx="11" fill="#fff" stroke="#2e8fd1" stroke-width="2"/><text x="495.5" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">HTML article</text><text x="495.5" y="252" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">first acceptable &lt;p&gt;</text><rect x="684" y="205" width="262" height="83" rx="11" fill="#fff" stroke="#a8b3bf" stroke-width="2"/><text x="815.0" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">Non-HTML</text><text x="815.0" y="252" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">return None</text><path d="M470,137 L470,177" fill="none" stroke="#34424e" stroke-width="2" marker-end="url(#arrow)"/><path d="M470,177 L169,177" fill="none" stroke="#34424e" stroke-width="2" marker-end="url(#arrow)"/><path d="M169,177 L169,205" fill="none" stroke="#34424e" stroke-width="2" marker-end="url(#arrow)"/><path d="M470,177 L496,205" fill="none" stroke="#34424e" stroke-width="2" marker-end="url(#arrow)"/><path d="M470,177 L815,177" fill="none" stroke="#34424e" stroke-width="2" marker-end="url(#arrow)"/><path d="M815,177 L815,205" fill="none" stroke="#34424e" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="328" font-family="Arial,sans-serif" font-weight="bold" font-size="17" fill="#34424e" text-anchor="middle">Lead extraction: first paragraph ≥50 chars, retain ≤1000 chars.</text><text x="500" y="359" font-family="Arial,sans-serif" font-weight="normal" font-size="15" fill="#e78321" text-anchor="middle">Read HTML in 64 KB increments; this is parser streaming, NOT semantic chunking.</text></svg>