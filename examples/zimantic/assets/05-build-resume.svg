<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 395" role="img" aria-labelledby="heading" style="font-synthesis:none"><title id="heading">05-build-resume</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#34424e"/></marker></defs><rect x="1" y="1" width="978" height="393" rx="16" fill="#f7f9fb" stroke="#cbd3da"/><text x="500" y="37" font-family="Arial,sans-serif" font-weight="bold" font-size="22" fill="#34424e" text-anchor="middle">Build lifecycle: checkpoint, train, persist, finalize</text><rect x="18" y="92" width="218" height="94" rx="11" fill="#fff" stroke="#2e8fd1" stroke-width="2"/><text x="127.0" y="117" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">Scan entries</text><text x="127.0" y="139" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">read_entry()</text><path d="M236,139 L262,139" fill="none" stroke="#34424e" stroke-width="2" marker-end="url(#arrow)"/><rect x="262" y="92" width="218" height="94" rx="11" fill="#fff" stroke="#e78321" stroke-width="2"/><text x="371.0" y="117" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">Batch commit</text><text x="371.0" y="139" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">docs + vecs + next</text><path d="M480,139 L506,139" fill="none" stroke="#34424e" stroke-width="2" marker-end="url(#arrow)"/><rect x="506" y="92" width="218" height="94" rx="11" fill="#fff" stroke="#2f9f5b" stroke-width="2"/><text x="615.0" y="117" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">Construct FAISS</text><text x="615.0" y="139" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">Flat / IVF+SQ8</text><path d="M724,139 L750,139" fill="none" stroke="#34424e" stroke-width="2" marker-end="url(#arrow)"/><rect x="750" y="92" width="218" height="94" rx="11" fill="#fff" stroke="#d4317b" stroke-width="2"/><text x="859.0" y="117" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">Finalize</text><text x="859.0" y="139" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">drop vecs; done=1</text><rect x="240" y="253" width="500" height="70" rx="11" fill="#fff" stroke="#e78321" stroke-width="2"/><text x="490.0" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">Interrupted build?</text><text x="490.0" y="300" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">Resume at meta.next (before finalization)</text><text x="500" y="365" font-family="Arial,sans-serif" font-weight="normal" font-size="14" fill="#e78321" text-anchor="middle">Source note: the CLI also refuses a build when the .faiss file already exists.</text></svg>