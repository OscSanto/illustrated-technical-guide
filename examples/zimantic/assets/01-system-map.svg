<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 384" role="img" aria-labelledby="heading" style="font-synthesis:none"><title id="heading">01-system-map</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#34424e"/></marker></defs><rect x="1" y="1" width="978" height="382" rx="16" fill="#f7f9fb" stroke="#cbd3da"/><text x="500" y="38" font-family="Arial,sans-serif" font-weight="bold" font-size="23" fill="#34424e" text-anchor="middle">One archive, two persistent index files</text><rect x="43" y="76" width="190" height="72" rx="11" fill="#fff" stroke="#e78321" stroke-width="2"/><text x="138.0" y="101" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">ZIM archive</text><text x="138.0" y="123" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">HTML + redirects</text><rect x="321" y="76" width="270" height="72" rx="11" fill="#fff" stroke="#2e8fd1" stroke-width="2"/><text x="456.0" y="101" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">Indexing pass</text><text x="456.0" y="123" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">read_entry() + Embedder</text><rect x="680" y="76" width="253" height="72" rx="11" fill="#fff" stroke="#2f9f5b" stroke-width="2"/><text x="806.5" y="101" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">Search service</text><text x="806.5" y="123" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">FastAPI + Search</text><path d="M233,112 L321,112" fill="none" stroke="#34424e" stroke-width="2" marker-end="url(#arrow)"/><path d="M591,112 L680,112" fill="none" stroke="#34424e" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="226" width="245" height="70" rx="11" fill="#fff" stroke="#2e8fd1" stroke-width="2"/><text