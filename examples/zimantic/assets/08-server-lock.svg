<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 425" role="img" aria-labelledby="heading" style="font-synthesis:none"><title id="heading">08-server-lock</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#34424e"/></marker></defs><rect x="1" y="1" width="978" height="423" rx="16" fill="#f7f9fb" stroke="#cbd3da"/><text x="500" y="34" font-family="Arial,sans-serif" font-weight="bold" font-size="22" fill="#34424e" text-anchor="middle">Concurrency: requests arrive together, search executes singly</text><rect x="35" y="80" width="235" height="63" rx="11" fill="#fff" stroke="#2e8fd1" stroke-width="2"/><text x="152.5" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">HTTP request 1</text><text x="152.5" y="127" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">/api/search?q=...</text><path d="M270,112 L405,195" fill="none" stroke="#34424e" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="165" width="235" height="63" rx="11" fill="#fff" stroke="#2f9f5b" stroke-width="2"/><text x="152.5" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">HTTP request 2</text><text x="152.5" y="212" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">/api/search?q=...</text><path d="M270,197 L405,195" fill="none" stroke="#34424e" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="250" width="235" height="63" rx="11" fill="#fff" stroke="#e78321" stroke-width="2"/><text x="152.5" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">HTTP request 3</text><text x="152.5" y="297" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">/api/search?q=...</text><path d="M270,282 L405,195" fill="none" stroke="#34424e" stroke-width="2" marker-end="url(#arrow)"/><rect x="405" y="164" width="240" height="70" rx="11" fill="#fff" stroke="#d4317b" stroke-width="2"/><text x="525.0" y="189" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">threading.Lock</text><text x="525.0" y="211" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">one search at a time</text><rect x="738" y="164" width="207" height="70" rx="11" fill="#fff" stroke="#2f9f5b" stroke-width="2"/><text x="841.5" y="189" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">Search.search()</text><text x="841.5" y="211" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">shared state</text><path d="M645,199 L738,199" fill="none" stroke="#34424e" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="390" font-family="Arial,sans-serif" font-weight="normal" font-size="16" fill="#e78321" text-anchor="middle">A lock is NOT a benchmark of CPU scaling; ONNX may use internal CPU threads.</text></svg>