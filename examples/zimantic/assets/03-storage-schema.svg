<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 392" role="img" aria-labelledby="heading" style="font-synthesis:none"><title id="heading">03-storage-schema</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#34424e"/></marker></defs><rect x="1" y="1" width="978" height="390" rx="16" fill="#f7f9fb" stroke="#cbd3da"/><text x="500" y="40" font-family="Arial,sans-serif" font-weight="bold" font-size="23" fill="#34424e" text-anchor="middle">Per-ZIM storage: schema and exact identity mapping</text><rect x="35" y="76" width="290" height="150" rx="11" fill="#fff" stroke="#2e8fd1" stroke-width="2"/><text x="180.0" y="101" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">docs (FTS5)</text><text x="180.0" y="123" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">rowid = ZIM entry ID</text><text x="60" y="157" font-family="Arial,sans-serif" font-weight="normal" font-size="15" fill="#2e8fd1" text-anchor="start">title: indexed</text><text x="60" y="181" font-family="Arial,sans-serif" font-weight="normal" font-size="14" fill="#34424e" text-anchor="start">lead/path/target: UNINDEXED</text><text x="60" y="202" font-family="Arial,sans-serif" font-weight="normal" font-size="13" fill="#e78321" text-anchor="start">target → canonical rowid</text><rect x="356" y="76" width="280" height="150" rx="11" fill="#fff" stroke="#e78321" stroke-width="2"/><text x="496.0" y="101" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">vecs (temporary)</text><text x="496.0" y="123" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">id → float16 blob</text><text x="496" y="159" font-family="Arial,sans-serif" font-weight="normal" font-size="14" fill="#34424e" text-anchor="middle">only rows with a lead</text><text x="496" y="185" font-family="Arial,sans-serif" font-weight="normal" font-size="14" fill="#d4317b" text-anchor="middle">DROPPED after FAISS</text><rect x="679" y="76" width="260" height="150" rx="11" fill="#fff" stroke="#2f9f5b" stroke-width="2"/><text x="809.0" y="101" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">FAISS index</text><text x="809.0" y="123" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">IDMap / IVF+SQ8</text><text x="809" y="167" font-family="Arial,sans-serif" font-weight="normal" font-size="14" fill="#34424e" text-anchor="middle">vector ID = docs.rowid</text><path d="M324,137 L356,137" fill="none" stroke="#34424e" stroke-width="2" marker-end="url(#arrow)"/><path d="M636,137 L678,137" fill="none" stroke="#34424e" stroke-width="2" marker-end="url(#arrow)"/><rect x="356" y="266" width="280" height="73" rx="11" fill="#fff" stroke="#a8b3bf" stroke-width="2"/><text x="496.0" y="291" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">meta</text><text x="496.0" y="313" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">next, done</text><text x="496" y="367" font-family="Arial,sans-serif" font-weight="bold" font-size="15" fill="#34424e" text-anchor="middle">Checkpoint data is committed atomically with each batch.</text></svg>