<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 366" role="img" aria-labelledby="heading" style="font-synthesis:none"><title id="heading">10-benchmark-design</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#34424e"/></marker></defs><rect x="1" y="1" width="978" height="364" rx="16" fill="#f7f9fb" stroke="#cbd3da"/><text x="500" y="35" font-family="Arial,sans-serif" font-weight="bold" font-size="22" fill="#34424e" text-anchor="middle">Controlled experiments for core-count and RAM comparisons</text><rect x="28" y="95" width="286" height="94" rx="11" fill="#fff" stroke="#2e8fd1" stroke-width="2"/><text x="171.0" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">Keep constant</text><text x="171.0" y="142" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">ZIM + model + queries</text><rect x="349" y="95" width="286" height="94" rx="11" fill="#fff" stroke="#e78321" stroke-width="2"/><text x="492.0" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">Change one factor</text><text x="492.0" y="142" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">threads / batch / nprobe</text><rect x="670" y="95" width="280" height="94" rx="11" fill="#fff" stroke="#2f9f5b" stroke-width="2"/><text x="810.0" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">Measure</text><text x="810.0" y="142" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">RSS, CPU, p95, recall</text><path d="M314,143 L349,143" fill="none" stroke="#34424e" stroke-width="2" marker-end="url(#arrow)"/><path d="M635,143 L670,143" fill="none" stroke="#34424e" stroke-width="2" marker-end="url(#arrow)"/><rect x="191" y="260" width="598" height="76" rx="11" fill="#fff" stroke="#d4317b" stroke-width="2"/><text x="490.0" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">Decision rule</text><text x="490.0" y="307" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">Do not infer scaling from cores or memory alone</text></svg>