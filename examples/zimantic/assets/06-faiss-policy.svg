<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 352" role="img" aria-labelledby="heading" style="font-synthesis:none"><title id="heading">06-faiss-policy</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#34424e"/></marker></defs><rect x="1" y="1" width="978" height="350" rx="16" fill="#f7f9fb" stroke="#cbd3da"/><text x="500" y="42" font-family="Arial,sans-serif" font-weight="bold" font-size="22" fill="#34424e" text-anchor="middle">Vector index chosen by number of embedded articles</text><rect x="40" y="99" width="412" height="157" rx="11" fill="#fff" stroke="#2e8fd1" stroke-width="2"/><text x="246.0" y="124" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">n &lt; 10,000</text><text x="246.0" y="146" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">IDMap,Flat  • exact scan</text><text x="246" y="213" font-family="Arial,sans-serif" font-weight="normal" font-size="15" fill="#34424e" text-anchor="middle">Search all stored vectors</text><rect x="530" y="99" width="410" height="157" rx="11" fill="#fff" stroke="#2f9f5b" stroke-width="2"/><text x="735.0" y="124" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#34424e">n ≥ 10,000</text><text x="735.0" y="146" text-anchor="middle" font-family="monospace" font-size="12" fill="#34424e">IVF(4·√n), SQ8  • approximate</text><text x="735" y="213" font-family="Arial,sans-serif" font-weight="normal" font-size="15" fill="#34424e" text-anchor="middle">Scan nprobe clusters (default 64)</text><text x="500" y="312" font-family="Arial,sans-serif" font-weight="bold" font-size="16" fill="#e78321" text-anchor="middle">Only vectors for pages with leads count toward n—not total ZIM entries.</text></svg>